<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stock-farmer 信号诊断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", sans-serif; }
  </style>
</head>
<body class="bg-[#0f1117] text-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12 md:py-20">

    <!-- Hero -->
    <header class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-bold mb-2">stock-farmer</h1>
      <p class="text-gray-400">输入股票代码，生成 10 信号诊断报告</p>
    </header>

    <!-- Input -->
    <form id="analyzeForm" onsubmit="return handleSubmit(event)"
          class="flex items-center gap-3 max-w-md mx-auto mb-4">
      <input id="tickerInput" type="text" placeholder="输入代码 如 AAPL、0700.HK、9992.HK"
             autofocus
             class="flex-1 bg-[#1a1f2e] border border-gray-600 rounded-xl px-4 py-3 text-base
                    focus:border-blue-500 focus:outline-none text-gray-100 placeholder-gray-500">
      <button id="submitBtn" type="submit"
              class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition-colors whitespace-nowrap">
        分析
      </button>
    </form>
    <p id="status" class="text-center text-sm text-gray-500 mb-10 h-5"></p>

    <!-- Reports List -->
    <section id="reportsSection" class="hidden">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">历史报告</h2>
      <div id="reportsList" class="space-y-2"></div>
    </section>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 mt-16">
      <p>仅供参考，不构成投资建议</p>
      <p class="mt-1">
        <a href="https://github.com/tomczhang/stock-farmer" class="hover:text-gray-400">GitHub</a>
        <span class="mx-2">·</span>
        <button onclick="resetToken()" class="hover:text-gray-400 underline">重置 Token</button>
      </p>
    </footer>
  </div>

  <script>
    const REPO = 'tomczhang/stock-farmer';
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    // Load reports
    loadReports();

    async function loadReports() {
      try {
        const base = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        const r = await fetch(base + '/reports/index.json');
        if (!r.ok) return;
        const reports = await r.json();
        if (!reports.length) return;

        document.getElementById('reportsSection').classList.remove('hidden');
        const list = document.getElementById('reportsList');
        // Sort by date descending
        reports.sort((a, b) => b.date.localeCompare(a.date));
        list.innerHTML = reports.map(r => {
          const dateStr = r.date.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
          return `<a href="reports/${r.file}" class="block bg-[#1a1f2e] rounded-lg border border-gray-700/40 px-4 py-3 hover:border-blue-500/50 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-medium">${r.ticker}</span>
              <span class="text-xs text-gray-500">${dateStr}</span>
            </div>
          </a>`;
        }).join('');
      } catch(e) { /* no reports yet */ }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
      if (!ticker) return false;

      // Check for existing report first
      const today = new Date().toISOString().slice(0,10).replace(/-/g, '');
      const reportUrl = `reports/${ticker}_${today}.html`;

      const token = localStorage.getItem('gh_token');
      if (!token) {
        const t = prompt('首次使用需输入 GitHub Personal Access Token\n\n生成方式：GitHub → Settings → Developer Settings → Personal Access Tokens → Fine-grained\n权限：Contents (read/write) + Actions (read/write)');
        if (!t) return false;
        localStorage.setItem('gh_token', t.trim());
        triggerAnalyze(ticker, t.trim());
      } else {
        triggerAnalyze(ticker, token);
      }
      return false;
    }

    async function triggerAnalyze(ticker, token) {
      btn.textContent = '提交中...';
      btn.disabled = true;
      statusEl.textContent = '';

      try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github+json',
          },
          body: JSON.stringify({
            event_type: 'analyze',
            client_payload: { ticker }
          })
        });

        if (r.status === 204 || r.ok) {
          btn.textContent = '已触发 ✓';
          statusEl.innerHTML = `<span class="text-green-400">✓ 分析已触发，约 1 分钟后生成</span>
            <a href="https://github.com/${REPO}/actions" target="_blank" class="text-blue-400 hover:underline ml-2">查看进度 →</a>`;
          // Poll for result
          pollReport(ticker);
        } else if (r.status === 401 || r.status === 403) {
          localStorage.removeItem('gh_token');
          statusEl.innerHTML = '<span class="text-red-400">Token 无效或权限不足，请重新输入</span>';
        } else {
          statusEl.innerHTML = `<span class="text-red-400">触发失败: HTTP ${r.status}</span>`;
        }
      } catch(e) {
        statusEl.innerHTML = `<span class="text-red-400">网络错误: ${e.message}</span>`;
      }
      setTimeout(() => { btn.textContent = '分析'; btn.disabled = false; }, 3000);
    }

    async function pollReport(ticker) {
      const today = new Date().toISOString().slice(0,10).replace(/-/g, '');
      const url = `reports/${ticker}_${today}.html`;
      let attempts = 0;
      const maxAttempts = 24; // 2 minutes
      const interval = setInterval(async () => {
        attempts++;
        if (attempts > maxAttempts) {
          clearInterval(interval);
          statusEl.innerHTML += '<br><span class="text-yellow-400">超时，请手动刷新页面检查</span>';
          return;
        }
        try {
          const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
          if (r.ok) {
            clearInterval(interval);
            statusEl.innerHTML = `<span class="text-green-400">✓ 报告已生成！</span>
              <a href="${url}" class="text-blue-400 hover:underline ml-2">查看报告 →</a>`;
            setTimeout(() => window.location.href = url, 1500);
          }
        } catch(e) { /* keep polling */ }
      }, 5000);
    }

    function resetToken() {
      localStorage.removeItem('gh_token');
      statusEl.innerHTML = '<span class="text-gray-400">Token 已清除</span>';
    }
  </script>
</body>
</html>
