<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stock-farmer 信号诊断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", sans-serif; }
  </style>
</head>
<body class="bg-[#0f1117] text-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12 md:py-20">

    <!-- Hero -->
    <header class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-bold mb-2">stock-farmer</h1>
      <p class="text-gray-400">查看 10 信号诊断报告</p>
    </header>

    <!-- Search -->
    <form id="analyzeForm" onsubmit="return handleSubmit(event)"
          class="flex items-center gap-3 max-w-md mx-auto mb-4">
      <input id="tickerInput" type="text" placeholder="搜索股票代码 如 AAPL、0700.HK"
             autofocus autocomplete="off"
             class="flex-1 bg-[#1a1f2e] border border-gray-600 rounded-xl px-4 py-3 text-base
                    focus:border-blue-500 focus:outline-none text-gray-100 placeholder-gray-500">
      <button id="submitBtn" type="submit"
              class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition-colors whitespace-nowrap">
        查看
      </button>
    </form>
    <p id="status" class="text-center text-sm text-gray-500 mb-10 h-5"></p>

    <!-- Reports List -->
    <section id="reportsSection" class="hidden">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">历史报告</h2>
      <div id="reportsList" class="space-y-2"></div>
    </section>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 mt-16">
      <p>仅供参考，不构成投资建议</p>
      <p class="mt-1">
        <a href="https://github.com/tomczhang/stock-farmer" class="hover:text-gray-400">GitHub</a>
      </p>
    </footer>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const inputEl = document.getElementById('tickerInput');
    let allReports = [];

    // Load reports
    loadReports();

    async function loadReports() {
      try {
        const base = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        const r = await fetch(base + '/reports/index.json');
        if (!r.ok) return;
        allReports = await r.json();
        if (!allReports.length) return;
        // Sort by date descending（最新在前，便于"查看"取最新一份）
        allReports.sort((a, b) => b.date.localeCompare(a.date));
        document.getElementById('reportsSection').classList.remove('hidden');
        renderReports(allReports);
      } catch(e) { /* no reports yet */ }
    }

    function renderReports(reports) {
      const list = document.getElementById('reportsList');
      if (!reports.length) {
        list.innerHTML = '<p class="text-sm text-gray-500 px-1">没有匹配的报告</p>';
        return;
      }
      list.innerHTML = reports.map(r => {
        const dateStr = r.date.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
        return `<a href="reports/${r.file}" class="block bg-[#1a1f2e] rounded-lg border border-gray-700/40 px-4 py-3 hover:border-blue-500/50 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-medium">${r.ticker}</span>
              <span class="text-xs text-gray-500">${dateStr}</span>
            </div>
          </a>`;
      }).join('');
    }

    // 实时过滤历史报告列表
    inputEl.addEventListener('input', (e) => {
      const q = e.target.value.trim().toUpperCase();
      statusEl.textContent = '';
      renderReports(q ? allReports.filter(r => r.ticker.toUpperCase().includes(q)) : allReports);
    });

    // 回车/点击"查看"：跳转匹配到的最新报告，无匹配则提示
    function handleSubmit(e) {
      e.preventDefault();
      const q = inputEl.value.trim().toUpperCase();
      if (!q) return false;
      const matches = allReports.filter(r => r.ticker.toUpperCase().includes(q));
      if (matches.length) {
        window.location.href = 'reports/' + matches[0].file;  // allReports 已按日期降序
      } else {
        statusEl.innerHTML = `<span class="text-gray-400">暂无『${q}』报告</span>`;
      }
      return false;
    }
  </script>
</body>
</html>
