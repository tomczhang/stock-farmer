name: analyze

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '股票代码（如 AAPL、0700.HK、9992.HK）'
        required: true
        type: string

  schedule:
    # 港股盘后（HKT 16:30 = UTC 08:30），错峰晚于 pipeline 半小时，工作日
    - cron: '0 9 * * 1-5'
    # 美股盘后（EST 16:30 = UTC 21:30），错峰晚于 pipeline 半小时，工作日
    - cron: '0 22 * * 1-5'

# 部署写 gh-pages，串行避免 push 冲突；批量定时任务不被后续触发取消。
concurrency:
  group: analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt yfinance

      - name: Determine tickers
        id: tickers
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TICKERS="${{ github.event.inputs.ticker }}"
          else
            # 定时批量：报告 watchlist（阵容对齐 db/seed_watchlist.sql，去掉指数 SPX）
            TICKERS="AAPL MSFT NVDA GOOGL AMZN META TSLA TSM BRK.B UNH 0700.HK"
          fi
          echo "value=$TICKERS" >> "$GITHUB_OUTPUT"
          echo "Tickers: $TICKERS"

      - name: Run analysis
        working-directory: pipeline
        run: |
          OK=0 FAIL=0 FAILED_TICKERS=""
          for t in ${{ steps.tickers.outputs.value }}; do
            echo "::group::Analyze $t"
            if python analyze.py "$t" --output-dir "${{ github.workspace }}/_site/reports"; then
              OK=$((OK + 1))
            else
              FAIL=$((FAIL + 1))
              FAILED_TICKERS="$FAILED_TICKERS $t"
              echo "::warning::Analysis failed for $t"
            fi
            echo "::endgroup::"
          done
          echo "Summary: $OK ok, $FAIL failed.${FAILED_TICKERS:+ Failed:$FAILED_TICKERS}"
          # 单股失败可容忍（批量容错），但全军覆没说明数据源/流水线坏了，必须报红。
          if [ "$OK" -eq 0 ]; then
            echo "::error::All analyses failed — no reports generated."
            exit 1
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh-pages

      - name: Merge reports
        run: |
          mkdir -p _gh-pages/reports
          cp _site/reports/*.html _gh-pages/reports/ 2>/dev/null || true

          # Update index.json
          cd _gh-pages/reports
          echo '[' > index.json.tmp
          FIRST=true
          for f in *.html; do
            [ "$f" = "*.html" ] && break
            TICKER=$(echo "$f" | sed 's/_[0-9]*\.html//')
            DATE=$(echo "$f" | sed 's/.*_\([0-9]*\)\.html/\1/')
            if [ "$FIRST" = true ]; then FIRST=false; else echo ',' >> index.json.tmp; fi
            echo "  {\"ticker\": \"$TICKER\", \"date\": \"$DATE\", \"file\": \"$f\"}" >> index.json.tmp
          done
          echo ']' >> index.json.tmp
          mv index.json.tmp index.json

      - name: Deploy to gh-pages
        run: |
          cd _gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update reports"
          git push
